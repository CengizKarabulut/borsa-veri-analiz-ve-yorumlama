name: Telegram BIST Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      ack_all:
        description: 'Bekleyen tüm mesajları İŞLEME ALMADAN temizle (kuyruk sıfırlama)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: telegram-bist-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ensure DejaVu fonts for PDF (Türkçe karakter desteği)
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core || true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_CHAT_IDS: ${{ secrets.AUTHORIZED_CHAT_IDS }}
        run: |
          if [ "${{ inputs.ack_all }}" = "true" ]; then
            python telegram_bist_bot.py --ack-all
          else
            python telegram_bist_bot.py --once
          fi
