name: Telegram BIST Bot

on:
  # GitHub cron en sık 5 dakikada bir çalışır
  schedule:
    - cron: '*/5 * * * *'
  # Manuel tetikleme de mümkün
  workflow_dispatch:

# Aynı anda birden fazla çalışma olmasını engelle
concurrency:
  group: telegram-bist-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_CHAT_IDS: ${{ secrets.AUTHORIZED_CHAT_IDS }}
        run: python telegram_bist_bot.py --once
